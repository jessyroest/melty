name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: lint, typecheck, test, build, bundle + log checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: typecheck (web)
        run: pnpm --filter @melty/web typecheck
      - name: typecheck (relay)
        run: pnpm --filter @melty/relay typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm check:logs

  e2e:
    name: browser e2e (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Google Chrome is preinstalled on the ubuntu-latest runner image, so
      # playwright-core can use it via BROWSER_CHANNEL=chrome; nothing is downloaded.
      - name: Start relay and web preview
        run: |
          nohup pnpm --filter @melty/relay dev > "$RUNNER_TEMP/relay.log" 2>&1 &
          nohup pnpm --filter @melty/web preview > "$RUNNER_TEMP/preview.log" 2>&1 &

      - name: Wait for ports 8787 and 4173
        run: |
          for port in 8787 4173; do
            for i in $(seq 1 60); do
              if curl -s -o /dev/null "http://localhost:$port/"; then
                echo "port $port is up"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "port $port did not respond within 60s"
                exit 1
              fi
              sleep 1
            done
          done

      - name: e2e smoke
        run: pnpm e2e
        env:
          BROWSER_CHANNEL: chrome

      - name: e2e features
        run: pnpm e2e:features
        env:
          BROWSER_CHANNEL: chrome

      - name: e2e xss
        run: pnpm e2e:xss
        env:
          BROWSER_CHANNEL: chrome

      - name: e2e resilience
        run: pnpm e2e:resilience
        env:
          BROWSER_CHANNEL: chrome

      - name: e2e phase 2 (words, key exchange, safety words, padding)
        run: pnpm e2e:phase2
        env:
          BROWSER_CHANNEL: chrome

      - name: e2e screenshot deterrents
        run: pnpm e2e:deter
        env:
          BROWSER_CHANNEL: chrome

      - name: Server output (on failure)
        if: failure()
        run: |
          echo "--- relay ---"; tail -n 50 "$RUNNER_TEMP/relay.log" || true
          echo "--- preview ---"; tail -n 50 "$RUNNER_TEMP/preview.log" || true

  secrets:
    name: secrets scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the action lists a PR's commits through the API
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, not just the last commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          # Required by the action (GitHub API calls). Free for repos on a personal account;
          # an organization repo also needs a free GITLEAKS_LICENSE secret from gitleaks.io.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # No PR comments (would need pull-requests: write), and no report artifact,
          # because the raw report would contain the leaked value itself.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
